<style>
  :root{
    --negro:#141311; --negro2:#1c1a16; --verde:#5f6f3d; --verde-claro:#8ba05e; --verde-oscuro:#3f4a29;
    --beige:#e4e2da; --crema:#efeee9; --linea:#d3d0c4; --texto-sec:#726f61;
    --sombra: 0 1px 2px rgba(20,19,17,.06), 0 8px 20px -6px rgba(20,19,17,.18), 0 2px 4px -2px rgba(20,19,17,.12);
    --sombra-chica: 0 1px 2px rgba(20,19,17,.08), 0 3px 8px -3px rgba(20,19,17,.15);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--beige); color:var(--negro); font-family:'Archivo',system-ui,sans-serif;}
  body{min-height:100vh; padding-bottom:60px;}
  button{font-family:inherit; cursor:pointer;}

  /* ---------- Header ---------- */
  .topbar{background:linear-gradient(180deg,var(--negro) 0%, var(--negro2) 100%); color:var(--crema);
    padding:26px clamp(20px,5vw,56px) 0;}
  .topbar__row{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; padding-bottom:20px;}
  .topbar__brand{display:flex; align-items:center; gap:18px;}
  .topbar__brand img{height:58px; width:auto; display:block; filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));}
  .topbar__title{font-size:26px; font-weight:900; letter-spacing:-0.01em;}
  .topbar__title span{display:block; font-size:12.5px; font-weight:500; color:#a9a79c; margin-top:3px; letter-spacing:0;}
  .topbar__right{display:flex; flex-direction:column; align-items:flex-end; gap:10px;}
  .topbar__meta{font-size:12px; color:#a9a79c; text-align:right;}
  .topbar__meta strong{color:var(--crema); font-weight:700;}
  .topbar__acciones{display:flex; gap:8px;}
  .btn-descarga{
    background:#232019; color:var(--crema); border:1px solid #3a3830; border-radius:3px;
    padding:8px 14px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px;
    transition:background .15s, border-color .15s;
  }
  .btn-descarga:hover{background:#2c291f; border-color:var(--verde);}

  /* ---------- Tabs ---------- */
  .tabs{display:flex; gap:2px; padding:0 clamp(20px,5vw,56px);}
  .tab{
    background:transparent; border:none; color:#8f8c7e; font-size:13.5px; font-weight:600;
    padding:12px 18px; border-radius:4px 4px 0 0; position:relative; top:1px;
  }
  .tab.activo{background:var(--beige); color:var(--negro);}
  .tab .contador{
    display:inline-block; background:#b23b2e; color:#fff; font-size:10.5px; font-weight:700;
    border-radius:20px; padding:1px 7px; margin-left:6px;
  }

  main{max-width:1140px; margin:0 auto; padding:clamp(24px,4vw,40px) clamp(20px,5vw,56px);}
  .pestana{display:none;}
  .pestana.activa{display:block;}

  /* ---------- Filtros ---------- */
  .filtros{
    background:var(--crema); border:1px solid var(--linea); border-radius:5px; box-shadow:var(--sombra-chica);
    display:flex; gap:18px; padding:14px 18px; flex-wrap:wrap; align-items:center; margin-bottom:26px;
  }
  .filtros label{color:var(--texto-sec); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-right:8px;}
  .filtros select{
    background:#fff; color:var(--negro); border:1px solid var(--linea); border-radius:4px;
    padding:8px 12px; font-family:inherit; font-size:13px; font-weight:600;
  }
  .filtros__grupo{display:flex; align-items:center;}

  .seccion-titulo{font-size:13px; font-weight:700; color:var(--texto-sec); margin-bottom:14px; letter-spacing:.01em;}

  /* ---------- KPIs ---------- */
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:28px;}
  .kpi{
    background:var(--negro); color:var(--crema); padding:22px 24px; border-radius:6px;
    box-shadow:var(--sombra); border:1px solid #2a2924; position:relative; overflow:hidden;
  }
  .kpi::before{content:""; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--verde);}
  .kpi__label{font-size:11.5px; color:#a9a79c; margin-bottom:7px; font-weight:600;}
  .kpi__valor{font-size:clamp(22px,3vw,28px); font-weight:900; color:var(--verde-claro); line-height:1.1;}
  .kpi__sub{font-size:11px; color:#8f8c7e; margin-top:5px;}

  /* ---------- Tabla vendedores (siempre visible) ---------- */
  .tabla-vendedores{
    background:#fff; border:1px solid var(--linea); border-radius:6px; box-shadow:var(--sombra-chica);
    overflow:hidden; margin-bottom:28px;
  }
  .tabla-vendedores table{width:100%; border-collapse:collapse; font-size:13px;}
  .tabla-vendedores th{background:var(--negro); color:#a9a79c; text-align:left; padding:11px 16px; font-size:11px; text-transform:uppercase; letter-spacing:.03em; font-weight:700;}
  .tabla-vendedores td{padding:11px 16px; border-top:1px solid var(--linea);}
  .tabla-vendedores tr:hover td{background:var(--crema);}
  .tabla-vendedores td.num{text-align:right; font-weight:700;}
  .badge-origen{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; background:var(--verde); color:#fff;}
  .badge-origen.mostrador{background:#8f8c7e;}

  /* ---------- Paneles / gráficos ---------- */
  .paneles{display:grid; grid-template-columns:1.4fr 1fr; gap:20px; margin-bottom:24px;}
  .paneles--3{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:900px){ .paneles, .paneles--3{grid-template-columns:1fr;} }
  .panel{
    background:#fff; border:1px solid var(--linea); border-radius:6px; box-shadow:var(--sombra-chica);
    padding:20px 22px 16px;
  }
  .panel h3{font-size:14px; font-weight:700; margin-bottom:4px;}
  .panel .panel__sub{font-size:11.5px; color:var(--texto-sec); margin-bottom:14px;}
  .panel canvas{max-height:270px;}

  .lista-clientes{list-style:none; margin-top:10px;}
  .lista-clientes li{
    display:flex; justify-content:space-between; align-items:baseline; padding:9px 0; border-top:1px solid var(--linea);
    cursor:pointer; font-size:13px;
  }
  .lista-clientes li:hover{background:var(--crema);}
  .lista-clientes .et{font-size:9.5px; background:var(--verde-oscuro); color:#fff; padding:1px 6px; border-radius:20px; margin-left:8px;}

  .detalle-cliente{
    background:var(--negro); color:var(--crema); padding:20px 22px; margin-top:16px; border-radius:6px;
    box-shadow:var(--sombra); display:none;
  }
  .detalle-cliente.activo{display:block;}
  .detalle-cliente__top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  .detalle-cliente__nombre{font-weight:800; font-size:17px; color:var(--verde-claro);}
  .detalle-cliente__et{font-size:10.5px; background:#2a2924; padding:2px 9px; border-radius:20px; color:#c9c6ba; margin-top:5px; display:inline-block;}
  .detalle-cliente__cerrar{cursor:pointer; color:#a9a79c; font-size:12px; background:none; border:none;}
  .detalle-cliente__grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px;}
  @media (max-width:700px){ .detalle-cliente__grid{grid-template-columns:repeat(2,1fr);} }
  .detalle-cliente__grid div{font-size:11px; color:#a9a79c;}
  .detalle-cliente__grid strong{display:block; color:var(--crema); font-size:16px; font-weight:800; margin-top:2px;}
  .detalle-cliente canvas{max-height:180px; margin-top:6px;}
  .detalle-cliente table{width:100%; font-size:12px; margin-top:8px; border-collapse:collapse;}
  .detalle-cliente table th{text-align:left; color:#8f8c7e; font-size:10.5px; padding:6px 0; border-bottom:1px solid #2a2924;}
  .detalle-cliente table td{padding:6px 0; border-bottom:1px solid #232019;}

  /* ---------- Buscador de cliente ---------- */
  .buscador-cliente{
    background:#fff; border:1px solid var(--linea); border-radius:6px; box-shadow:var(--sombra-chica);
    padding:22px; margin-bottom:24px;
  }
  .buscador-cliente input{
    width:100%; padding:12px 14px; font-size:15px; font-family:inherit; border:1px solid var(--linea);
    border-radius:4px; background:var(--crema);
  }
  .buscador-cliente input:focus{outline:2px solid var(--verde); outline-offset:1px;}

  /* ---------- Comisión ---------- */
  .comision{background:var(--negro); color:var(--crema); border-radius:6px; box-shadow:var(--sombra); padding:clamp(24px,4vw,34px); margin-bottom:24px;}
  .comision__label{font-size:13px; color:#a9a79c; font-weight:500; margin-bottom:6px;}
  .comision__monto{font-size:clamp(34px,5.5vw,48px); font-weight:900; line-height:1; color:var(--verde-claro);}
  .comision__sub{font-size:13px; color:#a9a79c; margin-top:8px;}
  .comision__grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:16px; margin-top:20px; padding-top:18px; border-top:1px solid #35332e;}
  .comision__item dt{font-size:11px; color:#a9a79c; margin-bottom:3px;}
  .comision__item dd{font-size:16px; font-weight:700;}

  /* ---------- Alertas ---------- */
  .alerta{border:1px solid var(--negro); border-left:6px solid var(--verde); border-radius:4px; box-shadow:var(--sombra-chica);
    padding:clamp(22px,3vw,30px); background:#fff;}
  .alerta__cabecera{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:8px;}
  .alerta__numero{font-size:36px; font-weight:900;}
  .alerta__titulo{font-size:16px; font-weight:700;}
  .alerta__texto{font-size:13.5px; color:#4a4840; max-width:64ch; margin-bottom:18px;}
  .oportunidad{padding:14px 0; border-top:1px solid var(--linea); display:grid; grid-template-columns:1fr auto; gap:4px 16px;}
  .oportunidad__nombre{font-weight:700; font-size:14px;}
  .oportunidad__empresa{font-size:12px; color:var(--texto-sec);}
  .oportunidad__fechas{font-size:11px; color:var(--texto-sec); text-align:right; white-space:nowrap;}
  .oportunidad__notas{grid-column:1/-1; font-size:12px; color:#4a4840; font-style:italic; margin-top:6px; border-left:2px solid var(--linea); padding-left:10px;}
  .oportunidad__notas.vacia{color:#a19d8e;}

  .vacio, .estado{background:#fff; border:1px solid var(--linea); border-radius:6px; padding:32px; text-align:center; color:var(--texto-sec); font-size:14px;}
  .estado.error{color:#8a3b2c;}
  footer{max-width:1140px; margin:0 auto; padding:0 clamp(20px,5vw,56px); font-size:11.5px; color:#8f8c7e;}

  @media print{
    .topbar__acciones, .tabs, .filtros{display:none !important;}
    .pestana{display:block !important;}
  }
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhPd5cYOr_YLlpc_ped7i6BSNb2Nq06F4k1Se8fE2ru4d7zUAdHbJ7aw0doFZySW67/exec";
const MESES = ["","Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MESES_LARGO = ["","enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const VERDES = ["#5f6f3d","#8ba05e","#a3b47b","#bcc99c","#d4dcbd","#3f4a29","#728258","#93a170"];

let LINEAS = [], COMISION = [], GANADO = [];
let chartClientes=null, chartModalidad=null, chartCategoria=null, chartTendencia=null, chartPrecio=null, chartDiaCliente=null;

function moneda(n){ if(n===null||n===undefined||isNaN(n)) return "—"; return "$"+Math.round(n).toLocaleString("es-AR"); }
function fechaHora(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d)) return "—";
  return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}) + " " +
         d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
}
function fechaCorta(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d)) return "—";
  return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});
}

// ---------- Tabs ----------
document.addEventListener("click", (e)=>{
  const tab = e.target.closest(".tab");
  if(!tab) return;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("activo"));
  document.querySelectorAll(".pestana").forEach(p=>p.classList.remove("activa"));
  tab.classList.add("activo");
  document.getElementById("pestana-"+tab.dataset.tab).classList.add("activa");
});

// ---------- Descargas ----------
function descargarVista(){ window.print(); }
function descargarInformeCompleto(){
  const headers = ["sistema","referencia","fecha","cliente","etiquetaCliente","vendedor","producto","categoria","cantidad","total","modalidad"];
  const filas = [headers.join(",")].concat(
    LINEAS.map(l => headers.map(h => `"${String(l[h]??"").replace(/"/g,'""')}"`).join(","))
  );
  const blob = new Blob([filas.join("\n")], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "informe_completo_palumbo.csv";
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- Agregaciones ----------
function agrupar(lineas, campo){
  const m = {};
  lineas.forEach(l=>{ const k=l[campo]||"Sin dato"; m[k]=(m[k]||0)+l.total; });
  return m;
}
function coloresN(n){ const out=[]; for(let i=0;i<n;i++) out.push(VERDES[i%VERDES.length]); return out; }

// ================= RESUMEN EMPRESA =================
function poblarFiltros(){
  const meses = [...new Set(LINEAS.map(l=>`${l.anio}-${String(l.mes).padStart(2,"0")}`))].sort();
  const selMes = document.getElementById("fMes");
  meses.forEach(m=>{
    const [a,mm] = m.split("-");
    const op = document.createElement("option");
    op.value = m; op.textContent = `${MESES[parseInt(mm)]} ${a}`;
    selMes.appendChild(op);
  });
  const vendedores = [...new Set(LINEAS.map(l=>l.vendedor).filter(Boolean))].sort();
  const selVen = document.getElementById("fVendedor");
  vendedores.forEach(v=>{
    const op = document.createElement("option");
    op.value = v; op.textContent = v;
    selVen.appendChild(op);
  });
}

function filtrarResumen(){
  const mes = document.getElementById("fMes").value;
  const vendedor = document.getElementById("fVendedor").value;
  const modalidad = document.getElementById("fModalidad").value;
  return LINEAS.filter(l=>{
    if(mes!=="todos" && `${l.anio}-${String(l.mes).padStart(2,"0")}`!==mes) return false;
    if(vendedor!=="todos" && l.vendedor!==vendedor) return false;
    if(modalidad!=="todos" && l.modalidad!==modalidad) return false;
    return true;
  });
}

function renderKpisResumen(lineas){
  const total = lineas.reduce((s,l)=>s+l.total,0);
  const pedidos = new Set(lineas.map(l=>l.sistema+"|"+l.referencia)).size;
  const clientes = new Set(lineas.map(l=>l.cliente)).size;
  const ticket = pedidos ? total/pedidos : 0;
  document.getElementById("kpiTotal").textContent = moneda(total);
  document.getElementById("kpiPedidos").textContent = pedidos.toLocaleString("es-AR");
  document.getElementById("kpiClientes").textContent = clientes.toLocaleString("es-AR");
  document.getElementById("kpiTicket").textContent = moneda(ticket);
}

function renderTablaVendedores(lineas){
  const m = {};
  lineas.forEach(l=>{
    const k = l.vendedor || "Sin dato";
    if(!m[k]) m[k] = {total:0, pedidos:new Set()};
    m[k].total += l.total;
    m[k].pedidos.add(l.sistema+"|"+l.referencia);
  });
  const totalGlobal = Object.values(m).reduce((s,v)=>s+v.total,0);
  const filas = Object.entries(m).sort((a,b)=>b[1].total-a[1].total).map(([nombre,d])=>{
    const esMostrador = nombre==="ACOPIO" || nombre==="Tj Admin";
    const pct = totalGlobal ? (d.total/totalGlobal*100).toFixed(1) : "0";
    return `<tr>
      <td>${nombre} <span class="badge-origen ${esMostrador?'mostrador':''}">${esMostrador?'mostrador':'gestión'}</span></td>
      <td class="num">${moneda(d.total)}</td>
      <td class="num">${d.pedidos.size}</td>
      <td class="num">${pct}%</td>
    </tr>`;
  }).join("");
  document.getElementById("tablaVendedoresBody").innerHTML = filas || `<tr><td colspan="4">Sin datos</td></tr>`;
}

function renderTendencia(){
  const m = {};
  LINEAS.forEach(l=>{
    const k = `${l.anio}-${String(l.mes).padStart(2,"0")}`;
    m[k] = (m[k]||0) + l.total;
  });
  const claves = Object.keys(m).sort();
  const ctx = document.getElementById("chartTendencia");
  if(chartTendencia) chartTendencia.destroy();
  chartTendencia = new Chart(ctx, {
    type:"line",
    data:{ labels: claves.map(k=>{const [a,mm]=k.split("-"); return MESES[parseInt(mm)]+" "+a;}),
      datasets:[{ data: claves.map(k=>m[k]), borderColor:"#5f6f3d", backgroundColor:"rgba(95,111,61,.15)",
        fill:true, tension:.3, pointBackgroundColor:"#3f4a29", pointRadius:4 }] },
    options:{ plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>moneda(c.parsed.y)}} },
      scales:{ y:{ ticks:{ callback:v=>"$"+(v/1e6).toFixed(0)+"M" } } } }
  });
}

function renderTopClientes(lineas){
  const porCliente = agrupar(lineas,"cliente");
  const top = Object.entries(porCliente).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const etiquetas = {};
  lineas.forEach(l=>{ if(!etiquetas[l.cliente]) etiquetas[l.cliente]=l.etiquetaCliente; });

  const ul = document.getElementById("listaClientes");
  ul.innerHTML = top.map(([nombre,total])=>
    `<li data-cliente="${nombre.replace(/"/g,'&quot;')}">
       <span>${nombre}<span class="et">${etiquetas[nombre]||"Sin clasificar"}</span></span>
       <strong>${moneda(total)}</strong>
     </li>`).join("");

  const ctx = document.getElementById("chartClientes");
  if(chartClientes) chartClientes.destroy();
  chartClientes = new Chart(ctx, {
    type:"bar",
    data:{ labels: top.map(t=>t[0]), datasets:[{ data: top.map(t=>t[1]), backgroundColor: coloresN(top.length), borderRadius:3 }] },
    options:{ indexAxis:"y", plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>moneda(c.parsed.x)}} },
      scales:{ x:{ ticks:{ callback:v=>"$"+(v/1e6).toFixed(1)+"M" } } },
      onClick:(evt,elems)=>{ if(!elems.length) return; mostrarDetalleClienteResumen(top[elems[0].index][0], lineas); } }
  });

  ul.querySelectorAll("li").forEach(li=>{
    li.addEventListener("click", ()=> mostrarDetalleClienteResumen(li.dataset.cliente, lineas));
  });
}

function mostrarDetalleClienteResumen(nombre, lineas){
  const propias = lineas.filter(l=>l.cliente===nombre);
  const total = propias.reduce((s,l)=>s+l.total,0);
  const cantidad = propias.reduce((s,l)=>s+(Number(l.cantidad)||0),0);
  const pedidos = new Set(propias.map(l=>l.sistema+"|"+l.referencia)).size;
  const porProducto = agrupar(propias,"producto");
  const top = Object.entries(porProducto).sort((a,b)=>b[1]-a[1])[0];
  const div = document.getElementById("detalleClienteResumen");
  div.innerHTML = `
    <div class="detalle-cliente__top">
      <div><div class="detalle-cliente__nombre">${nombre}</div>
      <span class="detalle-cliente__et">${propias[0]?.etiquetaCliente||"Sin clasificar"}</span></div>
      <button class="detalle-cliente__cerrar" onclick="document.getElementById('detalleClienteResumen').classList.remove('activo')">cerrar ✕</button>
    </div>
    <div class="detalle-cliente__grid">
      <div>Facturación<strong>${moneda(total)}</strong></div>
      <div>Pedidos<strong>${pedidos}</strong></div>
      <div>Cantidad total<strong>${cantidad.toLocaleString("es-AR")}</strong></div>
      <div>Producto principal<strong style="font-size:13px;">${top?top[0]:"—"}</strong></div>
    </div>`;
  div.classList.add("activo");
}

function renderModalidad(lineas){
  const m = agrupar(lineas,"modalidad");
  const entradas = Object.entries(m).sort((a,b)=>b[1]-a[1]);
  const ctx = document.getElementById("chartModalidad");
  if(chartModalidad) chartModalidad.destroy();
  chartModalidad = new Chart(ctx, {
    type:"doughnut",
    data:{ labels: entradas.map(e=>e[0]), datasets:[{ data: entradas.map(e=>e[1]), backgroundColor: coloresN(entradas.length), borderColor:"#fff", borderWidth:2 }] },
    options:{ plugins:{ legend:{position:"bottom", labels:{boxWidth:12,font:{size:11}}}, tooltip:{callbacks:{label:c=>`${c.label}: ${moneda(c.parsed)}`}} } }
  });
  const totalTodas = entradas.reduce((s,e)=>s+e[1],0);
  const nota = document.getElementById("notaModalidad");
  if (entradas.length===0 || totalTodas===0){
    nota.textContent = "Sin datos para este filtro.";
  } else {
    nota.textContent = "";
  }
}

function renderCategoria(lineas){
  const m = agrupar(lineas,"categoria");
  const entradas = Object.entries(m).sort((a,b)=>b[1]-a[1]);
  const ctx = document.getElementById("chartCategoria");
  if(chartCategoria) chartCategoria.destroy();
  chartCategoria = new Chart(ctx, {
    type:"bar",
    data:{ labels: entradas.map(e=>e[0]), datasets:[{ data: entradas.map(e=>e[1]), backgroundColor:"#8ba05e", borderRadius:3 }] },
    options:{ plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>moneda(c.parsed.y)}} },
      scales:{ y:{ ticks:{ callback:v=>"$"+(v/1e6).toFixed(1)+"M" } } } }
  });
}

function renderPrecioUnitario(lineas){
  const porCliente = {};
  lineas.forEach(l=>{
    if(!l.cantidad) return;
    const k = l.cliente;
    if(!porCliente[k]) porCliente[k] = {total:0, cantidad:0};
    porCliente[k].total += l.total;
    porCliente[k].cantidad += Number(l.cantidad);
  });
  const conPrecio = Object.entries(porCliente)
    .filter(([,d])=>d.cantidad>0)
    .map(([nombre,d])=>[nombre, d.total/d.cantidad, d.total]);
  const top = conPrecio.sort((a,b)=>b[2]-a[2]).slice(0,10);
  const ctx = document.getElementById("chartPrecio");
  if(chartPrecio) chartPrecio.destroy();
  chartPrecio = new Chart(ctx, {
    type:"bar",
    data:{ labels: top.map(t=>t[0]), datasets:[{ data: top.map(t=>t[1]), backgroundColor:"#3f4a29", borderRadius:3 }] },
    options:{ plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>moneda(c.parsed.y)+" / unidad"}} },
      scales:{ y:{ ticks:{ callback:v=>"$"+Math.round(v).toLocaleString("es-AR") } } } }
  });
}

function renderResumen(){
  const filtradas = filtrarResumen();
  renderKpisResumen(filtradas);
  renderTablaVendedores(filtradas);
  renderTopClientes(filtradas);
  renderModalidad(filtradas);
  renderCategoria(filtradas);
  renderPrecioUnitario(filtradas);
  document.getElementById("detalleClienteResumen").classList.remove("activo");
}

// ================= FRANCO =================
function renderComision(){
  const cont = document.getElementById("comisionCont");
  if(!COMISION.length){ cont.innerHTML = `<div class="vacio">Todavía no hay pedidos de Franco cargados para calcular comisión este mes.</div>`; return; }
  const ultimo = COMISION[COMISION.length-1];
  const mesNombre = MESES_LARGO[ultimo.mes]||ultimo.mes;
  let extra = "";
  if(COMISION.length>1){
    const previos = COMISION.slice(0,-1).map(m=>{
      const nombre = MESES_LARGO[m.mes]||m.mes;
      return `<div class="comision__item"><dt>${nombre} ${m.anio}</dt><dd>${moneda(m.totalACobrar)}</dd></div>`;
    }).join("");
    extra = `<div class="comision__grid">${previos}</div>`;
  }
  cont.innerHTML = `
    <div class="comision">
      <div class="comision__label">Comisión estimada — ${mesNombre} ${ultimo.anio}</div>
      <div class="comision__monto">${moneda(ultimo.totalACobrar)}</div>
      <div class="comision__sub">Sobre facturación gestionada de ${moneda(ultimo.facturacion)}, tramo ${ultimo.tramo} (${(ultimo.porcentaje*100).toFixed(1)}%)</div>
      <div class="comision__grid">
        <div class="comision__item"><dt>Facturación del mes</dt><dd>${moneda(ultimo.facturacion)}</dd></div>
        <div class="comision__item"><dt>Comisión variable</dt><dd>${moneda(ultimo.comisionVariable)}</dd></div>
        <div class="comision__item"><dt>Básico fijo</dt><dd>${moneda(ultimo.basicoFijo)}</dd></div>
      </div>
      ${extra?`<div class="seccion-titulo" style="margin-top:22px;">Meses anteriores</div>${extra}`:""}
    </div>`;

  const deFranco = LINEAS.filter(l=>l.vendedor==="Franco Valero");
  const total = deFranco.reduce((s,l)=>s+l.total,0);
  const totalEmpresaMismoMes = ultimo ? LINEAS.filter(l=>l.anio===ultimo.anio && l.mes===ultimo.mes).reduce((s,l)=>s+l.total,0) : 0;
  const pct = totalEmpresaMismoMes ? (ultimo.facturacion/totalEmpresaMismoMes*100).toFixed(1) : "—";
  const pedidos = new Set(deFranco.map(l=>l.sistema+"|"+l.referencia)).size;
  const clientes = new Set(deFranco.map(l=>l.cliente)).size;
  document.getElementById("francoKpis").innerHTML = `
    <div class="kpi"><div class="kpi__label">% sobre facturación total del mes</div><div class="kpi__valor">${pct}%</div>
      <div class="kpi__sub">del mes de comisión mostrado arriba</div></div>
    <div class="kpi"><div class="kpi__label">Pedidos gestionados (histórico)</div><div class="kpi__valor">${pedidos}</div></div>
    <div class="kpi"><div class="kpi__label">Clientes distintos</div><div class="kpi__valor">${clientes}</div></div>
    <div class="kpi"><div class="kpi__label">Facturación histórica total</div><div class="kpi__valor">${moneda(total)}</div></div>
  `;
}

// ================= ALERTAS =================
function renderAlerta(){
  const cont = document.getElementById("alertaCont");
  if(!GANADO.length){
    cont.innerHTML = `<div class="alerta"><div class="alerta__cabecera"><span class="alerta__numero">0</span>
      <span class="alerta__titulo">oportunidades ganadas sin pedido vinculado</span></div>
      <p class="alerta__texto">No hay pendientes — todas las Ganado tienen su pedido cargado en Odoo.</p></div>`;
    document.getElementById("contadorAlertas").style.display = "none";
    return;
  }
  document.getElementById("contadorAlertas").style.display = "inline-block";
  document.getElementById("contadorAlertas").textContent = GANADO.length;
  const items = GANADO.map(o=>{
    const notas = o.notas && o.notas.trim() ? o.notas : "Sin notas de gestión cargadas";
    const notasClase = o.notas && o.notas.trim() ? "" : "vacia";
    return `<div class="oportunidad">
      <div><div class="oportunidad__nombre">${o.oportunidad||"(sin nombre)"}</div>
      <div class="oportunidad__empresa">${o.empresa||"—"}</div></div>
      <div class="oportunidad__fechas">Creada ${fechaCorta(o.creadoEl)}<br>Cerrada ${fechaCorta(o.fechaCierre)}</div>
      <div class="oportunidad__notas ${notasClase}">${notas}</div></div>`;
  }).join("");
  cont.innerHTML = `<div class="alerta"><div class="alerta__cabecera"><span class="alerta__numero">${GANADO.length}</span>
    <span class="alerta__titulo">oportunidades ganadas sin pedido vinculado</span></div>
    <p class="alerta__texto">Están marcadas Ganado pero no tienen pedido de venta asociado — Franco tiene que revisarlas.</p>
    ${items}</div>`;
}

// ================= BUSCADOR DE CLIENTE =================
function poblarBuscador(){
  const nombres = [...new Set(LINEAS.map(l=>l.cliente).filter(Boolean))].sort();
  const dl = document.getElementById("listaClientesDatalist");
  dl.innerHTML = nombres.map(n=>`<option value="${n.replace(/"/g,'&quot;')}"></option>`).join("");
}

function buscarCliente(){
  const nombre = document.getElementById("inputCliente").value.trim();
  const resultado = document.getElementById("resultadoCliente");
  if(!nombre){ resultado.innerHTML = ""; return; }
  const propias = LINEAS.filter(l=>l.cliente.toLowerCase()===nombre.toLowerCase());
  if(!propias.length){
    resultado.innerHTML = `<div class="vacio">No encontré ventas para "${nombre}" — revisá que el nombre esté escrito igual que en Odoo.</div>`;
    return;
  }
  const total = propias.reduce((s,l)=>s+l.total,0);
  const cantidad = propias.reduce((s,l)=>s+(Number(l.cantidad)||0),0);
  const pedidos = new Set(propias.map(l=>l.sistema+"|"+l.referencia)).size;
  const precioProm = cantidad ? total/cantidad : 0;
  const porProducto = agrupar(propias,"producto");
  const productos = Object.entries(porProducto).sort((a,b)=>b[1]-a[1]);
  const porDia = [0,0,0,0,0,0,0];
  propias.forEach(l=>{ const d = new Date(l.fecha).getDay(); porDia[d] += l.total; });

  resultado.innerHTML = `
    <div class="detalle-cliente activo">
      <div class="detalle-cliente__top">
        <div><div class="detalle-cliente__nombre">${propias[0].cliente}</div>
        <span class="detalle-cliente__et">${propias[0].etiquetaCliente||"Sin clasificar"}</span></div>
      </div>
      <div class="detalle-cliente__grid">
        <div>Facturación total<strong>${moneda(total)}</strong></div>
        <div>Pedidos<strong>${pedidos}</strong></div>
        <div>Cantidad total<strong>${cantidad.toLocaleString("es-AR")}</strong></div>
        <div>Precio unitario promedio<strong>${moneda(precioProm)}</strong></div>
      </div>
      <div class="seccion-titulo" style="color:#a9a79c; margin-top:6px;">Qué día de la semana compra</div>
      <canvas id="chartDiaCliente"></canvas>
      <div class="seccion-titulo" style="color:#a9a79c; margin-top:16px;">Productos comprados</div>
      <table>
        <tr><th>Producto</th><th style="text-align:right;">Facturación</th></tr>
        ${productos.map(([p,t])=>`<tr><td>${p}</td><td style="text-align:right;">${moneda(t)}</td></tr>`).join("")}
      </table>
    </div>`;

  const ctx = document.getElementById("chartDiaCliente");
  if(chartDiaCliente) chartDiaCliente.destroy();
  chartDiaCliente = new Chart(ctx, {
    type:"bar",
    data:{ labels: DIAS.map(d=>d.slice(0,3)), datasets:[{ data: porDia, backgroundColor:"#8ba05e", borderRadius:3 }] },
    options:{ plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>moneda(c.parsed.y)}} },
      scales:{ y:{ ticks:{ color:"#a9a79c", callback:v=>"$"+(v/1e3).toFixed(0)+"K" } }, x:{ ticks:{color:"#a9a79c"} } } }
  });
}

// ================= CARGA INICIAL =================
async function cargar(){
  try{
    const res = await fetch(SCRIPT_URL, {method:"GET"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    LINEAS = data.lineas || [];
    COMISION = data.comision || [];
    GANADO = data.ganadoSinPedido || [];

    document.getElementById("contenido").innerHTML = `
      <div class="pestana activa" id="pestana-resumen">
        <div class="filtros">
          <div class="filtros__grupo"><label for="fMes">Mes</label><select id="fMes"><option value="todos">Todos</option></select></div>
          <div class="filtros__grupo"><label for="fVendedor">Vendedor / origen</label><select id="fVendedor"><option value="todos">Todos</option></select></div>
          <div class="filtros__grupo"><label for="fModalidad">Modalidad</label>
            <select id="fModalidad"><option value="todos">Todas</option>
              <option value="Retiro en Cantera">Retiro en Cantera</option>
              <option value="Retiro en Depósito">Retiro en Depósito</option>
              <option value="Entrega en Obra">Entrega en Obra</option></select></div>
        </div>
        <div class="kpis">
          <div class="kpi"><div class="kpi__label">Facturación</div><div class="kpi__valor" id="kpiTotal">—</div></div>
          <div class="kpi"><div class="kpi__label">Pedidos</div><div class="kpi__valor" id="kpiPedidos">—</div></div>
          <div class="kpi"><div class="kpi__label">Clientes</div><div class="kpi__valor" id="kpiClientes">—</div></div>
          <div class="kpi"><div class="kpi__label">Ticket promedio</div><div class="kpi__valor" id="kpiTicket">—</div></div>
        </div>
        <div class="seccion-titulo">Facturación por vendedor / origen (siempre sobre el total, sin filtrar)</div>
        <div class="tabla-vendedores">
          <table><thead><tr><th>Vendedor / cuenta</th><th style="text-align:right;">Facturación</th><th style="text-align:right;">Pedidos</th><th style="text-align:right;">% del total</th></tr></thead>
          <tbody id="tablaVendedoresBody"></tbody></table>
        </div>
        <div class="panel" style="margin-bottom:24px;">
          <h3>Evolución mensual de facturación</h3>
          <div class="panel__sub">Ventas + Punto de Venta, todos los meses (no depende de los filtros)</div>
          <canvas id="chartTendencia"></canvas>
        </div>
        <div class="paneles">
          <div class="panel">
            <h3>Top 10 clientes por facturación</h3>
            <div class="panel__sub">Tocá una barra o un nombre de la lista para ver el detalle</div>
            <canvas id="chartClientes"></canvas>
            <ul class="lista-clientes" id="listaClientes"></ul>
            <div class="detalle-cliente" id="detalleClienteResumen"></div>
          </div>
          <div class="panel">
            <h3>Modalidad de entrega</h3>
            <div class="panel__sub" id="notaModalidad"></div>
            <canvas id="chartModalidad"></canvas>
          </div>
        </div>
        <div class="paneles">
          <div class="panel">
            <h3>Facturación por categoría de producto</h3>
            <canvas id="chartCategoria"></canvas>
          </div>
          <div class="panel">
            <h3>Precio unitario promedio — top 10 clientes</h3>
            <div class="panel__sub">Sobre los clientes con más facturación</div>
            <canvas id="chartPrecio"></canvas>
          </div>
        </div>
      </div>

      <div class="pestana" id="pestana-franco">
        <div id="comisionCont"></div>
        <div class="seccion-titulo">Desempeño histórico de Franco</div>
        <div class="kpis" id="francoKpis"></div>
      </div>

      <div class="pestana" id="pestana-alertas">
        <div id="alertaCont"></div>
      </div>

      <div class="pestana" id="pestana-cliente">
        <div class="buscador-cliente">
          <label for="inputCliente" style="display:block; font-size:12px; font-weight:700; color:var(--texto-sec); margin-bottom:8px;">Escribí o elegí el nombre del cliente tal como está en Odoo</label>
          <input list="listaClientesDatalist" id="inputCliente" placeholder="Ej: Corralon Ozamis" oninput="buscarCliente()">
          <datalist id="listaClientesDatalist"></datalist>

      </div>
    `;

    poblarFiltros();
    poblarBuscador();
    renderResumen();
    renderComision();
    renderAlerta();
    renderTendencia();

    ["fMes","fVendedor","fModalidad"].forEach(id=>{
      document.getElementById(id).addEventListener("change", renderResumen);
    });

    document.getElementById("actualizado").textContent = fechaHora(data.actualizado);
    document.getElementById("pie").style.display = "block";

  } catch(err){
    document.getElementById("contenido").innerHTML =
      `<div class="estado error">No se pudo leer la Base (${err.message}). Revisá que el Apps Script siga implementado y accesible, o recargá la página.</div>`;
  }
}
cargar();
</script>
